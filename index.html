        .fade-in-left.visible {
            opacity: 1;
            transform: translateX(0);

            opacity: 1;

        .stagger-children > .fade-in:nth-child(3) { transition-delay: 0.2s; }
        .stagger-children > .fade-in:nth-child(4) { transition-delay: 0.3s; }

            content: '';

            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(30, 91, 214, 0.08) 0%, transparent 60%);

        let currentLang = localStorage.getItem('lang') || 'en';

        function setLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('lang', lang);
            document.documentElement.lang = lang;

            // Update all translatable elements
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = translations[lang][key];
                    } else {
                        el.innerHTML = translations[lang][key];
                    }
                }
            });

            // Update language toggle buttons
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
        }

    <!-- Component Loader -->
    <script>
        async function loadComponent(id, file) {
            const element = document.getElementById(id);
            try {
                const response = await fetch(file);
                if (!response.ok) throw new Error(`Could not load ${file}`);
                const html = await response.text();
                element.innerHTML = html;

                // Execute inline scripts from loaded components
                const scripts = element.querySelectorAll('script');
                scripts.forEach(oldScript => {
                    const newScript = document.createElement('script');
                    if (oldScript.src) {
                        newScript.src = oldScript.src;
                    } else {
                        newScript.textContent = oldScript.textContent;
                    }
                    oldScript.parentNode.replaceChild(newScript, oldScript);
                });
            } catch (error) {
                console.error(error);
            }
        }

        // Initialize Landing Page
        document.addEventListener('DOMContentLoaded', async () => {
            await loadComponent('nav-placeholder', 'components/navbar.html');
            await loadComponent('hero-placeholder', 'sections/hero.html');
            await loadComponent('venture-placeholder', 'sections/venture.html');
            await loadComponent('enterprise-placeholder', 'sections/enterprise.html');
            await loadComponent('philosophy-placeholder', 'sections/philosophy.html');
            await loadComponent('contact-placeholder', 'sections/contact.html');
            await loadComponent('footer-placeholder', 'components/footer.html');

            // Apply saved language
            setLanguage(currentLang);

            // Initialize all animations
            initAnimations();
            initScrollProgress();
        });

        // ── Scroll Progress Bar ──
        function initScrollProgress() {
            const progressBar = document.getElementById('scroll-progress');
            window.addEventListener('scroll', () => {
                const scrollTop = window.scrollY;
                const docHeight = document.documentElement.scrollHeight - window.innerHeight;
                const progress = docHeight > 0 ? scrollTop / docHeight : 0;
                progressBar.style.transform = `scaleX(${progress})`;
            }, { passive: true });
        }

        // ── Scroll-Triggered Animations ──
        function initAnimations() {
            const animatedSelectors = '.fade-in, .fade-in-left, .fade-in-right, .scale-up, .blur-reveal, .section-divider';

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, {
                threshold: 0.1,
                rootMargin: '0px 0px -40px 0px'
            });

            document.querySelectorAll(animatedSelectors).forEach(el => {
                observer.observe(el);
            });
        }
    </script>
