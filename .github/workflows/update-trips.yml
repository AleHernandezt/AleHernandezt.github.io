name: Actualizar próximas salidas de Tripealo

on:
  schedule:
    - cron: "17 */3 * * *"   # cada 3 horas
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-trips
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leer tripealo.app
        run: python scripts/update_trips.py
      - name: Guardar cambios
        run: |
          if git diff --quiet -- assets/data/trips.json; then
            echo "Sin cambios"
            exit 0
          fi
          # Solo commitea si cambiaron los viajes, no solo la hora de actualización
          if git diff -U0 -- assets/data/trips.json | grep -E '^[+-] ' | grep -v '"updated"' | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/trips.json
            git commit -m "Actualizar próximas salidas de Tripealo"
            git push
          else
            echo "Solo cambió la fecha de actualización"
          fi
