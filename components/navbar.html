<nav class="fixed top-0 w-full z-50 glass transition-all duration-300 border-b border-white/10">
    <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
        <a href="#" class="text-2xl font-bold tracking-tighter text-white">
            AH<span class="text-dark-accent">.</span>
        </a>

        <!-- Desktop Menu -->
        <div class="hidden md:flex items-center gap-8">
            <a href="#venture" class="text-sm font-medium text-dark-muted hover:text-white transition-colors" data-i18n="nav.venture">Core Venture</a>
            <a href="#enterprise" class="text-sm font-medium text-dark-muted hover:text-white transition-colors" data-i18n="nav.enterprise">Enterprise</a>
            <a href="#philosophy" class="text-sm font-medium text-dark-muted hover:text-white transition-colors" data-i18n="nav.philosophy">Philosophy</a>

            <!-- Language Toggle -->
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
            </div>

            <a href="#contact" class="px-5 py-2.5 rounded-full bg-dark-accent hover:bg-dark-accent-hover text-white text-sm font-medium transition-all shadow-lg shadow-dark-accent/20" data-i18n="nav.connect">
                Connect
            </a>
        </div>

        <!-- Mobile Toggle -->
        <button id="mobile-toggle" class="md:hidden text-2xl text-dark-light focus:outline-none" aria-label="Toggle navigation menu">
            <i class="uil uil-bars"></i>
        </button>
    </div>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="md:hidden hidden flex-col gap-4 absolute top-20 left-0 w-full bg-dark-secondary border-b border-white/10 p-6">
        <a href="#venture" class="block text-base font-medium text-dark-light hover:text-dark-accent transition-colors py-2" data-i18n="nav.venture">Core Venture</a>
        <a href="#enterprise" class="block text-base font-medium text-dark-light hover:text-dark-accent transition-colors py-2" data-i18n="nav.enterprise">Enterprise</a>
        <a href="#philosophy" class="block text-base font-medium text-dark-light hover:text-dark-accent transition-colors py-2" data-i18n="nav.philosophy">Philosophy</a>
        <a href="#contact" class="block text-base font-medium text-dark-light hover:text-dark-accent transition-colors py-2" data-i18n="nav.connect">Connect</a>

        <!-- Mobile Language Toggle -->
        <div class="flex items-center gap-2 pt-2 border-t border-white/10 mt-2">
            <span class="text-dark-muted text-xs uppercase tracking-wider">Language:</span>
            <div class="lang-toggle">
                <button class="lang-btn active" data-lang="en" onclick="setLanguage('en')">EN</button>
                <button class="lang-btn" data-lang="es" onclick="setLanguage('es')">ES</button>
            </div>
        </div>
    </div>
</nav>

<script>
    const mobileToggle = document.getElementById('mobile-toggle');
    const mobileMenu = document.getElementById('mobile-menu');

    mobileToggle.addEventListener('click', () => {
        mobileMenu.classList.toggle('hidden');
        const icon = mobileToggle.querySelector('i');
        icon.classList.toggle('uil-bars');
        icon.classList.toggle('uil-times');
    });

    // Close mobile menu when clicking a link
    mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', () => {
            mobileMenu.classList.add('hidden');
            const icon = mobileToggle.querySelector('i');
            icon.classList.remove('uil-times');
            icon.classList.add('uil-bars');
        });
    });

    // Navbar scroll effect
    window.addEventListener('scroll', () => {
        const nav = document.querySelector('nav');
        if (window.scrollY > 50) {
            nav.classList.add('bg-dark-primary/90');
        } else {
            nav.classList.remove('bg-dark-primary/90');
        }
    }, { passive: true });
</script>
